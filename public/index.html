<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Terminaller">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="theme-color" content="#161b22">
<title>Claude Remote</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --muted:#8b949e; --acc:#d97757; --ok:#3fb950; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:15px -apple-system, system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px;
    padding:calc(env(safe-area-inset-top) + 8px) 12px 8px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  button { font:inherit; color:var(--fg); background:#21262d; border:1px solid var(--line); border-radius:8px;
    padding:8px 11px; min-height:38px; }
  button:active { background:#30363d; }
  button.acc { background:var(--acc); border-color:var(--acc); color:#fff; }
  .tabs { display:flex; gap:6px; padding:10px 12px 0; }
  .tabs button.on { border-color:var(--acc); color:var(--acc); }
  ul { list-style:none; margin:0; padding:8px 12px 24px; }
  li { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin-bottom:8px; }
  li .t { font-weight:600; display:flex; align-items:center; gap:6px; }
  li .s { color:var(--muted); font-size:13px; margin-top:3px; word-break:break-all; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; }
  .dot.claude { background:var(--acc); } .dot.att { box-shadow:0 0 0 2px var(--ok); }
  .row { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .empty { color:var(--muted); padding:24px 16px; line-height:1.5; }
  #term { display:none; flex-direction:column; height:100%; }
  #screen { flex:1; overflow:auto; margin:0; padding:8px; font:11px/1.25 ui-monospace, Menlo, monospace;
    white-space:pre; -webkit-overflow-scrolling:touch; }
  #screen.big { font-size:13px; } #screen.wrap { white-space:pre-wrap; word-break:break-all; }
  .keys { display:flex; gap:5px; overflow-x:auto; padding:6px 8px; background:var(--panel); border-top:1px solid var(--line); }
  .keys button { flex:none; padding:6px 10px; min-height:34px; font-size:14px; }
  form { display:flex; gap:6px; padding:6px 8px calc(env(safe-area-inset-bottom) + 6px); background:var(--panel); }
  textarea { flex:1; font:16px ui-monospace, Menlo, monospace; color:var(--fg); background:var(--bg);
    border:1px solid var(--line); border-radius:8px; padding:8px; resize:none; height:42px; }
  .b { font-weight:bold } .d { opacity:.6 } .i { font-style:italic } .u { text-decoration:underline }
  .bar { display:flex; gap:6px; padding:10px 12px 0; }
  input, select { font:16px -apple-system, system-ui, sans-serif; color:var(--fg); background:var(--bg);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-height:38px; width:100%; }
  .bar input { flex:1; }
  #sheet { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; z-index:8; align-items:flex-end; }
  #sheet .box { width:100%; background:var(--panel); border-top:1px solid var(--line); border-radius:14px 14px 0 0;
    padding:16px 14px calc(env(safe-area-inset-bottom) + 14px); display:flex; flex-direction:column; gap:10px; }
  #sheet h2 { font-size:16px; margin:0; } #sheet label { color:var(--muted); font-size:13px; }
  #sheet textarea { height:110px; font-family:-apple-system, system-ui, sans-serif; }
  #chat { display:none; flex-direction:column; height:100%; }
  #msgs { flex:1; overflow-y:auto; padding:10px 12px; -webkit-overflow-scrolling:touch; }
  .m { margin:0 0 10px; white-space:pre-wrap; word-wrap:break-word; line-height:1.4; }
  .m.u { background:#2d1f1a; border:1px solid #5a3527; border-radius:12px; padding:9px 11px; margin-left:28px; }
  .m.a { padding:2px 2px; }
  .m.t { color:var(--muted); font:12px ui-monospace, Menlo, monospace; margin-bottom:6px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  .m.t b { color:#79c0ff; font-weight:500; }
  .m code { font:13px ui-monospace, Menlo, monospace; background:#21262d; border-radius:4px; padding:0 3px; }
  .badge { font-size:11px; font-weight:600; padding:2px 7px; border-radius:10px; background:#21262d; color:var(--muted); }
  .badge.busy { background:#4a2a1c; color:#ffb38a; } .badge.idle { background:#173a24; color:#56d364; }
  #cfoot { padding:8px 8px calc(env(safe-area-inset-bottom) + 8px); background:var(--panel);
    border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
  #cfoot .note { color:var(--muted); font-size:13px; }
  html { -webkit-text-size-adjust:100%; }
  /* --- canlı kartlar --- */
  #sum { color:var(--muted); font-size:13px; padding:8px 12px 0; display:flex; gap:10px; align-items:center; }
  #sum b { color:var(--fg); font-weight:600; }
  #sum .sz { margin-left:auto; padding:4px 10px; min-height:30px; font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:8px; padding:8px 10px 28px; }
  .grid.big { grid-template-columns:repeat(auto-fill, minmax(330px, 1fr)); }
  @media (min-width:900px) { .grid { grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); }
    .grid.big { grid-template-columns:repeat(auto-fill, minmax(460px, 1fr)); } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden;
    display:flex; flex-direction:column; min-width:0; container-type:inline-size; }
  .card:active { transform:scale(.97); }
  .card.idle { border-color:#2ea043; box-shadow:0 0 0 1px #2ea043 inset; }
  .card.busy { border-color:#7a4a35; }
  .card .ch { display:flex; align-items:center; gap:5px; padding:6px 8px; font-size:12px; font-weight:600; min-width:0; }
  .card .ch span.n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* yazı kart genişliğine göre: küçükte ~60, büyükte ~80 sütun sığar */
  .card .mini { margin:0; background:#010409; color:#c9d1d9; padding:4px 5px; overflow:hidden; white-space:pre;
    font:5.6px/1.22 ui-monospace, Menlo, monospace; font-size:calc(100cqw / 36); height:calc(1.22em * 18 + 8px);
    display:flex; flex-direction:column; justify-content:flex-end; }
  .grid.big .mini { font-size:calc(100cqw / 48); height:calc(1.22em * 16 + 8px); }
  .mini .ln { min-height:1.22em; }
  .mini .ln.nw { animation:flash 1.6s ease-out; }
  @keyframes flash { 0% { background:rgba(217,119,87,.45); } 100% { background:transparent; } }
  .card.flow .ch::after { content:'● CANLI'; color:#ff7b72; font-size:9px; font-weight:700; animation:pulse 1s ease-in-out infinite; }
  .card .cf { padding:5px 8px 7px; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .cf b { color:var(--fg); font-weight:500; }
  .card .rs { display:block; width:100%; margin:0 0 5px; padding:6px; min-height:32px; font-size:12px; }
  .card .cf:has(.rs) { white-space:normal; }
  .card.add { align-items:center; justify-content:center; min-height:120px; color:var(--muted); font-size:14px;
    border-style:dashed; background:transparent; }
  .card.add span { font-size:30px; line-height:1; color:var(--acc); }
  .dot.busy { background:#ff9f6b; animation:pulse 1.1s ease-in-out infinite; }
  .dot.idle { background:#3fb950; }
  @keyframes pulse { 50% { opacity:.25; } }
  .card .badge { font-size:9.5px; padding:1px 6px; }
  #err { position:fixed; left:12px; right:12px; bottom:90px; background:#da3633; color:#fff; padding:10px;
    border-radius:8px; display:none; z-index:9; }
</style>
</head>
<body>
<div id="list">
  <header><h1>Laptop</h1><button id="refresh">↻</button></header>
  <div class="tabs"><button data-tab="l" class="on">Canlı</button><button data-tab="c">Geçmiş</button><button data-tab="p">Projeler</button></div>
  <div class="bar" id="pbar"><input id="q" type="search" placeholder="Ara…">
    <button class="acc" id="newp">+ Yeni</button></div>
  <div id="live"><div id="sum"></div><div class="grid" id="grid"></div></div>
  <ul id="items"></ul>
</div>

<div id="term">
  <header>
    <button id="back">‹</button><h1 id="ttl"></h1>
    <button id="kill">✕</button><button id="font">A</button><button id="wrap">⤶</button>
  </header>
  <pre id="screen"></pre>
  <div class="keys">
    <button data-k="Enter">⏎</button><button data-k="Escape">Esc</button><button data-k="C-c">^C</button>
    <button data-k="Up">↑</button><button data-k="Down">↓</button><button data-k="Left">←</button><button data-k="Right">→</button>
    <button data-k="Tab">Tab</button><button data-k="BTab">⇧Tab</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="y">y</button><button data-k="n">n</button>
    <button data-k="BSpace">⌫</button><button data-k="C-d">^D</button><button data-k="C-r">^R</button><button data-k="C-o">^O</button>
    <button data-k="PPage">PgUp</button><button data-k="NPage">PgDn</button>
  </div>
  <form id="f"><textarea id="in" placeholder="Yaz, gönder…" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    <button class="acc">↵</button></form>
</div>
<div id="chat">
  <header><button id="cback">‹</button><h1 id="ctitle"></h1><span id="cbadge" class="badge"></span></header>
  <div id="msgs"></div>
  <div id="cfoot"></div>
</div>
<div id="sheet"><form class="box" id="sf">
  <h2 id="sh"></h2>
  <div id="newfields"><label>Proje adı</label><input id="pname" autocapitalize="off" autocorrect="off" placeholder="ornek-proje">
    <label>Nereye</label><select id="proot"></select></div>
  <label>Claude'a görev (boş bırakabilirsin)</label>
  <textarea id="pprompt" placeholder="ör. Giriş sayfasına şifremi unuttum linki ekle"></textarea>
  <div class="row"><button type="button" id="scancel">Vazgeç</button><button class="acc" style="flex:1" id="sgo">Başlat</button></div>
</form></div>
<div id="err"></div>

<script>
const $ = s => document.querySelector(s);
let projects = [], sheetCwd = null;
let chatId = null, chatRev = null, chatTimer = null;
let tab = 'l', target = null, timer = null, lastText = '', stick = true;

async function call(method, url, body) {
  const r = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json', 'X-CR': '1' } : {},
    body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ error: r.status === 401 ? 'Oturum düştü — token linkini yeniden aç' : r.statusText }));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function toast(msg) { const e = $('#err'); e.textContent = msg; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 3500); }
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function ago(sec) { const d = Date.now() / 1000 - sec; return d < 60 ? 'şimdi' : d < 3600 ? Math.floor(d / 60) + ' dk' : d < 86400 ? Math.floor(d / 3600) + ' sa' : Math.floor(d / 86400) + ' g'; }

// --- liste ---
async function renderList() {
  const ul = $('#items');
  $('#live').style.display = tab === 'l' ? 'block' : 'none';
  ul.style.display = tab === 'l' ? 'none' : 'block';
  try {
    if (tab === 'l') return renderLive();
    if (tab === 'c') {
      const q = $('#q').value.trim().toLowerCase();
      const ss = (await call('GET', '/api/claude'))
        .filter(x => !q || (x.title + ' ' + x.project + ' ' + x.lastPrompt).toLowerCase().includes(q))
        .sort((a, b) => (b.live - a.live) || (b.mtime - a.mtime));
      ul.innerHTML = ss.map(x => `<li data-c="${x.id}"><div class="t"><span class="dot ${x.live ? 'claude' : ''}"></span>
          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.title)}</span>${badge(x)}</div>
          <div class="s">${esc(x.project)} · ${ago(x.mtime / 1000)}${x.tmux ? ' · tmux' : ''}</div>
          <div class="s" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">› ${esc(x.lastPrompt)}</div></li>`).join('')
        || '<div class="empty">Oturum bulunamadı.</div>';
    } else if (tab === 's') {
      const panes = await call('GET', '/api/panes');
      if (!panes.length) { ul.innerHTML = '<div class="empty">Açık tmux oturumu yok.<br>Laptop\'ta yeni terminal aç ya da Projeler\'den Claude başlat.</div>'; return; }
      ul.innerHTML = panes.sort((a, b) => b.activity - a.activity).map(p => {
        const t = `${p.session}:${p.win}.${p.pane}`, claude = /claude|node/i.test(p.cmd);
        return `<li data-t="${esc(t)}"><div class="t"><span class="dot ${claude ? 'claude' : ''} ${p.attached ? 'att' : ''}"></span>
          ${esc(p.session)}<span style="color:var(--muted);font-weight:400">${p.win || p.pane ? ' ' + p.win + '.' + p.pane : ''}</span></div>
          <div class="s">${esc(p.cmd)} · ${esc(p.cwd)} · ${ago(p.activity)}</div></li>`;
      }).join('');
    } else {
      if (!projects.length || !$('#q').value) projects = await call('GET', '/api/projects');
      const q = $('#q').value.trim().toLowerCase();
      ul.innerHTML = projects.filter(p => !q || p.name.toLowerCase().includes(q)).map(p => `<li><div class="t">${esc(p.name)}</div><div class="s">${esc(p.short)}</div>
        <div class="row"><button class="acc" data-task="${esc(p.path)}" data-name="${esc(p.name)}">Claude'a iş ver</button>
        <button data-new="${esc(p.path)}" data-cmd="claude --continue">Devam et</button>
        <button data-new="${esc(p.path)}">Shell</button></div></li>`).join('') || '<div class="empty">Proje bulunamadı.</div>';
    }
  } catch (e) { toast(e.message); }
}
$('#items').addEventListener('click', async e => {
  const cl = e.target.closest('li[data-c]');
  if (cl) return openChat(cl.dataset.c);
  const tb = e.target.closest('[data-task]');
  if (tb) return openSheet(tb.dataset.task, tb.dataset.name);
  const nb = e.target.closest('[data-new]');
  if (nb) {
    try { const r = await call('POST', '/api/new', { cwd: nb.dataset.new, cmd: nb.dataset.cmd || '' }); open(r.session + ':0.0'); }
    catch (err) { toast(err.message); }
    return;
  }
  const li = e.target.closest('li[data-t]'); if (li) open(li.dataset.t);
});
// --- canlı kartlar ---
const isRule = l => /^\s*[─━]{12,}\s*$/.test(l.replace(/\x1b\[[\d;:]*m/g, ''));
function miniText(p) {
  let lines = p.text.split('\n');
  // Claude ekranı: alttaki yazı kutusu + durum satırlarını at, konuşma görünsün
  if (p.claude) {
    const rules = [];
    lines.forEach((l, i) => { if (isRule(l)) rules.push(i); });
    if (rules.length >= 2) lines = lines.slice(0, rules[rules.length - 2]);
  }
  while (lines.length && !lines[lines.length - 1].replace(/\x1b\[[\d;:]*m/g, '').trim()) lines.pop();
  return lines.slice($('#grid').classList.contains('big') ? -16 : -18).join('\n');
}
// busy: Claude çalışıyor; idle / shell (işi bitti, arka planda komut açık): senden yazı bekliyor
const isBusy = p => p.claude && p.claude.status === 'busy';
function cardState(p) { return p.claude ? (isBusy(p) ? 'busy' : 'idle') : ''; }
// Claude'dan çıkılmış kabuk: ekranda kalan "claude --resume <id>" satırından devam edilebilir
function resumeId(p) {
  if (p.claude || !/^(bash|zsh|sh)$/.test(p.cmd)) return null;
  const m = p.text.replace(/\x1b\[[\d;:]*m/g, '').match(/claude --resume ([0-9a-f-]{36})\s*\n[^\n]*\n?[^\n]*\$\s*$/);
  return m ? m[1] : null;
}
function cardHead(p) {
  const st = cardState(p);
  const b = !p.claude ? `<span class="badge">${esc(p.cmd)}</span>`
    : st === 'busy' ? '<span class="badge busy">çalışıyor</span>' : '<span class="badge idle">bekliyor</span>';
  return `<span class="dot ${st}"></span><span class="n">${esc(p.project || p.t)}</span>${b}`;
}
function cardFoot(p) {
  const what = p.claude ? (p.claude.title || 'Claude') : p.cwd;
  const rid = resumeId(p);
  return (rid ? `<button class="acc rs" data-rid="${rid}">▶ Claude'a devam</button>` : '') + `<b>${esc(what)}</b> · ${ago(p.activity)}`;
}
let liveTimer = null, cards = new Map();
async function renderLive() {
  clearTimeout(liveTimer);
  try {
    const panes = await call('GET', '/api/live');
    if (tab !== 'l' || target || chatId) return;
    panes.sort((a, b) => (!!b.claude - !!a.claude) || (a.created - b.created) || a.t.localeCompare(b.t));
    const grid = $('#grid'), seen = new Set();
    for (const p of panes) {
      seen.add(p.t);
      let c = cards.get(p.t);
      if (!c) {
        const el = document.createElement('div');
        el.className = 'card'; el.dataset.t = p.t;
        el.innerHTML = '<div class="ch"></div><pre class="mini"></pre><div class="cf"></div>';
        c = { el, head: '', mini: '', foot: '', label: '' };
        cards.set(p.t, c);
      }
      c.label = p.project || p.t;
      const head = cardHead(p), mini = miniText(p), foot = cardFoot(p);
      c.el.className = 'card ' + cardState(p) + (c.el.classList.contains('flow') ? ' flow' : '');
      if (head !== c.head) { c.el.children[0].innerHTML = c.head = head; }
      if (mini !== c.mini) {
        // yeni/değişen satırlar kısa süre parlar; ilk çizimde parlama yok
        const prev = c.mini ? new Set(c.mini.split('\n')) : null;
        c.el.children[1].innerHTML = mini.split('\n')
          .map(l => `<div class="ln${prev && !prev.has(l) ? ' nw' : ''}">${ansi(l) || ' '}</div>`).join('');
        if (prev) { c.el.classList.add('flow'); clearTimeout(c.flowT); c.flowT = setTimeout(() => c.el.classList.remove('flow'), 3000); }
        c.mini = mini;
      }
      if (foot !== c.foot) { c.el.children[2].innerHTML = c.foot = foot; }
      grid.appendChild(c.el); // sıralamayı korur, yeniden çizmez
    }
    for (const [t, c] of cards) if (!seen.has(t)) { c.el.remove(); cards.delete(t); }
    let add = $('#addcard');
    if (!add) { add = document.createElement('div'); add.id = 'addcard'; add.className = 'card add'; add.innerHTML = '<span>＋</span>Yeni Claude'; }
    grid.appendChild(add);
    const cl = panes.filter(p => p.claude), busy = cl.filter(isBusy).length;
    const wait = cl.length - busy;
    $('#sum').innerHTML = (panes.length ? `<span><b>${busy}</b> çalışıyor</span><span><b>${wait}</b> bekliyor</span><span>${panes.length - cl.length} terminal</span>`
      : '<span>Açık terminal yok</span>') + `<button class="sz" id="sz">${grid.classList.contains('big') ? '▦ Küçük' : '▭ Büyük'}</button>`;
    document.title = wait ? `(${wait}) Terminaller` : 'Terminaller';
  } catch (e) { toast(e.message); }
  if (tab === 'l' && !target && !chatId) liveTimer = setTimeout(renderLive, document.hidden ? 8000 : 1000);
}
$('#grid').addEventListener('click', async e => {
  const rs = e.target.closest('[data-rid]');
  if (rs) {
    const t = rs.closest('.card').dataset.t;
    try { await call('POST', '/api/send', { t, text: 'claude --resume ' + rs.dataset.rid, enter: true }); open(t); }
    catch (err) { toast(err.message); }
    return;
  }
  if (e.target.closest('#addcard')) return document.querySelector('.tabs [data-tab="p"]').click();
  const c = e.target.closest('.card[data-t]');
  if (c) open(c.dataset.t, (cards.get(c.dataset.t) || {}).label);
});
$('#sum').addEventListener('click', e => {
  if (!e.target.closest('#sz')) return;
  const big = $('#grid').classList.toggle('big');
  try { localStorage.crCardBig = big ? 1 : ''; } catch {}
  cards.forEach(c => { c.mini = ''; }); renderLive();
});
try { if (localStorage.crCardBig) $('#grid').classList.add('big'); } catch {}

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab; $('#pbar').style.display = tab === 'l' ? 'none' : 'flex'; $('#newp').style.display = tab === 'p' ? '' : 'none';
  $('#q').value = ''; document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); renderList();
});
$('#refresh').onclick = () => { projects = []; renderList(); };
$('#q').oninput = renderList;

$('#newp').style.display = 'none';
$('#pbar').style.display = 'none';

// --- Claude sohbet görünümü ---
function badge(x) {
  if (!x.live) return '<span class="badge">kapalı</span>';
  return x.status === 'busy' ? '<span class="badge busy">çalışıyor</span>' : '<span class="badge idle">seni bekliyor</span>';
}
function md(t) {
  return esc(t).replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, c) => `<code style="display:block;white-space:pre;overflow-x:auto;padding:6px">${c}</code>`)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
}
function show(id) { ['#list', '#term', '#chat'].forEach(s => $(s).style.display = s === id ? (id === '#list' ? 'block' : 'flex') : 'none'); }
async function openChat(id) {
  chatId = id; chatRev = null; $('#msgs').innerHTML = ''; $('#cfoot').innerHTML = ''; $('#ctitle').textContent = '…';
  show('#chat'); if (location.hash !== '#c=' + id) history.pushState({}, '', '#c=' + id);
  clearTimeout(chatTimer); pollChat();
}
async function pollChat() {
  if (!chatId) return;
  const id = chatId;
  try {
    const d = await call('GET', `/api/chat?id=${id}&rev=${encodeURIComponent(chatRev || '')}`);
    if (id !== chatId) return;
    $('#cbadge').outerHTML = `<span id="cbadge">${badge(d)}</span>`;
    renderFoot(d);
    if (!d.same) {
      chatRev = d.rev; $('#ctitle').textContent = d.title;
      const box = $('#msgs'), atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
      box.innerHTML = d.items.map(i => i.k === 't'
        ? `<div class="m t">⚙ <b>${esc(i.n)}</b> ${esc(i.t)}</div>`
        : `<div class="m ${i.k}">${md(i.t)}</div>`).join('') || '<div class="empty">Mesaj yok.</div>';
      if (atEnd || !box.dataset.seen) { box.scrollTop = box.scrollHeight; box.dataset.seen = 1; }
    }
    if (d.live) chatTimer = setTimeout(pollChat, document.hidden ? 6000 : 2500);
  } catch (e) { toast(e.message); }
}
let footKey = '';
function renderFoot(d) {
  const key = d.live + ':' + d.tmux;
  if (key === footKey && $('#cfoot').innerHTML) return;
  footKey = key; const f = $('#cfoot');
  if (d.live && d.tmux) {
    f.innerHTML = `<button class="acc" id="cgo">Terminali aç — yaz, onay ver</button>`;
    $('#cgo').onclick = () => open(d.tmux);
  } else if (d.live) {
    f.innerHTML = `<div class="note">Laptopta normal terminalde açık — buradan sadece izlenebilir.</div>
      <button id="ctake">Devral: laptoptakini kapat, burada devam et</button>`;
    $('#ctake').onclick = () => resume(true);
  } else {
    f.innerHTML = `<textarea id="cin" placeholder="Devam mesajı (boş bırakabilirsin)"></textarea>
      <button class="acc" id="cres">Kaldığı yerden devam et</button>`;
    $('#cres').onclick = () => resume(false);
  }
}
async function resume(takeover) {
  if (takeover && !confirm('Laptoptaki Claude kapatılacak (yaptığı iş yarıda kalabilir) ve oturum burada açılacak. Devam?')) return;
  const prompt = ($('#cin') || {}).value || '';
  try { const r = await call('POST', '/api/resume', { id: chatId, prompt, takeover }); chatId = null; open(r.target); }
  catch (e) { toast(e.message); }
}
$('#cback').onclick = () => { chatId = null; clearTimeout(chatTimer); footKey = ''; history.pushState({}, '', location.pathname + location.search); show('#list'); renderList(); };

// --- görev / yeni proje penceresi ---
async function openSheet(cwd, name) {

  $('#sh').textContent = cwd ? name + ' — Claude' : 'Yeni proje';

const closeSheet = () => { $('#sheet').style.display = 'none'; };
$('#newp').onclick = () => openSheet(null);
$('#scancel').onclick = closeSheet;
$('#sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };

// --- ANSI → HTML ---
const BASE = ['#484f58','#ff7b72','#3fb950','#d29922','#58a6ff','#bc8cff','#39c5cf','#b1bac4',
              '#6e7681','#ffa198','#56d364','#e3b341','#79c0ff','#d2a8ff','#56d4dd','#ffffff'];
function c256(n) {
  if (n < 16) return BASE[n];
  if (n >= 232) { const v = 8 + (n - 232) * 10; return `rgb(${v},${v},${v})`; }
  n -= 16; const s = [0, 95, 135, 175, 215, 255];
  return `rgb(${s[Math.floor(n / 36)]},${s[Math.floor(n / 6) % 6]},${s[n % 6]})`;
}
function ansi(text) {
  let st = {}, out = '', open = false;
  const parts = text.split(/\x1b\[([\d;:]*)m/);
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 0) { out += esc(parts[i]); continue; }
    const c = parts[i] === '' ? [0] : parts[i].split(/[;:]/).map(Number);
    for (let j = 0; j < c.length; j++) {
      const n = c[j];
      if (n === 0) st = {};
      else if (n === 1) st.b = 1; else if (n === 2) st.d = 1; else if (n === 3) st.i = 1; else if (n === 4) st.u = 1;
      else if (n === 7) st.inv = 1; else if (n === 22) { delete st.b; delete st.d; } else if (n === 23) delete st.i;
      else if (n === 24) delete st.u; else if (n === 27) delete st.inv;
      else if (n >= 30 && n <= 37) st.fg = BASE[n - 30]; else if (n >= 90 && n <= 97) st.fg = BASE[n - 82];
      else if (n >= 40 && n <= 47) st.bg = BASE[n - 40]; else if (n >= 100 && n <= 107) st.bg = BASE[n - 92];
      else if (n === 39) delete st.fg; else if (n === 49) delete st.bg;
      else if (n === 38 || n === 48) {
        const k = n === 38 ? 'fg' : 'bg';
        if (c[j + 1] === 5) { st[k] = c256(c[j + 2]); j += 2; }
        else if (c[j + 1] === 2) { st[k] = `rgb(${c[j + 2]},${c[j + 3]},${c[j + 4]})`; j += 4; }
      }
    }
    if (open) out += '</span>';
    let fg = st.fg, bg = st.bg; if (st.inv) { fg = st.bg || 'var(--bg)'; bg = st.fg || 'var(--fg)'; }
    const cls = ['b', 'd', 'i', 'u'].filter(k => st[k]).join(' ');
    const sty = (fg ? `color:${fg};` : '') + (bg ? `background:${bg};` : '');
    open = !!(cls || sty);
    if (open) out += `<span${cls ? ` class="${cls}"` : ''}${sty ? ` style="${sty}"` : ''}>`;
  }
  return out + (open ? '</span>' : '');
}

// --- terminal ---
const scr = $('#screen');
scr.addEventListener('scroll', () => { stick = scr.scrollTop + scr.clientHeight >= scr.scrollHeight - 30; });
async function poll() {
  if (!target) return;
  try {
    const { text } = await call('GET', '/api/capture?t=' + encodeURIComponent(target));
    if (text !== lastText) { lastText = text; scr.innerHTML = ansi(text); if (stick) scr.scrollTop = scr.scrollHeight; }
  } catch (e) { toast(e.message); if (/can't find|no server/.test(e.message)) return back(); }
  timer = setTimeout(poll, document.hidden ? 4000 : 900);
}
function open(t, label) {
  target = t; lastText = ''; stick = true; scr.innerHTML = ''; clearTimeout(liveTimer);
  $('#ttl').textContent = label || (cards.get(t) || {}).label || t; show('#term'); footKey = '';
  if (location.hash !== '#' + encodeURIComponent(t)) history.pushState({}, '', '#' + encodeURIComponent(t));
  clearTimeout(timer); poll();
}
function back() {
  target = null; clearTimeout(timer); show('#list');
  if (location.hash) history.pushState({}, '', location.pathname + location.search); renderList();
}
$('#back').onclick = back;
$('#kill').onclick = async () => {
  const s = target.split(':')[0];
  if (!confirm(`"${s}" oturumu kapatılsın mı? İçindeki işlem sonlanır.`)) return;
  try { await call('POST', '/api/kill', { t: s }); back(); } catch (e) { toast(e.message); }
};
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('c=')) openChat(h.slice(2)); else if (h) open(h); else { chatId = null; back(); }
}
window.onpopstate = route;
const kick = () => { clearTimeout(timer); setTimeout(poll, 150); };
document.querySelector('.keys').addEventListener('click', async e => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  try { await call('POST', '/api/key', { t: target, key: b.dataset.k }); stick = true; kick(); } catch (err) { toast(err.message); }
});
$('#f').onsubmit = async e => {
  e.preventDefault(); const text = $('#in').value;
  try { await call('POST', '/api/send', { t: target, text, enter: true }); $('#in').value = ''; stick = true; kick(); }
  catch (err) { toast(err.message); }
};
$('#font').onclick = () => { scr.classList.toggle('big'); try { localStorage.crBig = scr.classList.contains('big') ? 1 : ''; } catch {} };
$('#wrap').onclick = () => { scr.classList.toggle('wrap'); try { localStorage.crWrap = scr.classList.contains('wrap') ? 1 : ''; } catch {} };
try { if (localStorage.crBig) scr.classList.add('big'); if (localStorage.crWrap) scr.classList.add('wrap'); } catch {}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (target) kick(); else if (chatId) { clearTimeout(chatTimer); pollChat(); } else renderList();
});

route();
setInterval(() => { if (tab !== 'l' && !target && !chatId && !document.hidden) renderList(); }, 5000);
</script>
