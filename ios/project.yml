name: ClaudeRemote
options:
  bundleIdPrefix: com.wpu
  deploymentTarget:
    iOS: "16.0"
targets:
  ClaudeRemote:
    type: application
    platform: iOS
    sources: [ClaudeRemote]
    info:
      path: ClaudeRemote/Info.plist
      properties:
        CFBundleDisplayName: Terminaller
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSFaceIDUsageDescription: Terminallere girmeden önce kimliğini doğrulamak için
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wpu.clauderemote
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
